<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7" id="metaTheme">
<meta name="description" content="可定制的个人主页：个人简介 / 自身技能 / 个人项目 / 联系方式 / 音乐播放器">
<title>个人主页</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230071e3'/%3E%3Ccircle cx='16' cy='13' r='4.6' fill='%23fff'/%3E%3Cpath d='M7 27c1.4-4.6 5-7 9-7s7.6 2.4 9 7' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/theme.css?v=13">
<link rel="stylesheet" href="css/main.css?v=13">

<!-- =========================================================================
     首屏主题预置（必须内联、且放在样式表之后）
     -------------------------------------------------------------------------
     线上（GitHub Pages 有 CDN 延迟）时，JS 要几百毫秒才开始跑；
     如果等 JS 再套用配色，浏览器会先按「默认配色」画一帧，
     再花 620ms 过渡到你的预设 —— 看起来就像"主题被重置成原生预设又改回来"。
     这段脚本同步读取 localStorage 里缓存的整套配色，在首次绘制前就贴上去。
     ====================================================================== -->
<script>
(function () {
  var root = document.documentElement;
  root.classList.add('theme-boot');                 /* 启动期先别做令牌过渡 */
  try {
    var d = JSON.parse(localStorage.getItem('dsh.home.v1') || 'null');
    var t = (d && d.theme) || {};
    var theme = t.manual === 'dark' ? 'dark' : 'light';
    if (t.mode === 'auto') {                        /* 跟随电脑时间：这里也先算一遍 */
      var h = new Date().getHours();
      var day = isNaN(+t.dayStart) ? 7 : +t.dayStart;
      var night = isNaN(+t.nightStart) ? 19 : +t.nightStart;
      theme = (h >= day && h < night) ? 'light' : 'dark';
    }
    root.setAttribute('data-theme', theme);
    var css = localStorage.getItem('dsh.home.themecss.v1');
    var el = document.createElement('style');
    el.id = 'dsh-color-overrides';                  /* 与 theme.js 共用同一张表，稍后由它接管 */
    if (css) el.textContent = css;
    document.head.appendChild(el);
  } catch (err) { /* 无痕模式等：忽略，交给 theme.js */ }
  setTimeout(function () { root.classList.remove('theme-boot'); }, 3000);   /* 兜底 */
})();
</script>
</head>
<body class="page page--home">

<!-- =========================================================================
     背景装饰层：双主题下光斑与网格线各自不同，切换时随令牌一起过渡
     ====================================================================== -->
<div class="bg-decor" aria-hidden="true">
  <span class="blob blob--1"></span>
  <span class="blob blob--2"></span>
  <span class="blob blob--3"></span>
  <i class="grid-lines"></i>
</div>

<!-- =========================================================================
     整体骨架：CSS Grid 两列
       .shell {
         grid-template-columns: 330px minmax(0, 1fr);
         grid-template-areas: "sidebar content";   ← 命名区域合并
       }
     ====================================================================== -->
<div class="shell">

  <!-- =======================================================================
       左侧栏（grid-area: sidebar）
         ① 左上角：设置按钮（跳转设置页）+ 昼夜切换按钮
         ② 中部：圆形头像 + 姓名
         ③ 下部：音乐播放器
         ④ 播放器下方：浮层歌词
       ==================================================================== -->
  <aside class="sidebar">
    <div class="sidebar__card glass">

      <!-- ① 左上角工具条 -->
      <div class="sidebar__top">
        <div class="sidebar__tools">
          <a class="icon-btn icon-btn--gear" id="settingsBtn" href="settings.html"
             title="打开设置" aria-label="打开设置页"></a>
          <button class="icon-btn theme-toggle" id="themeToggle" type="button"
                  title="切换白日 / 黑夜（快捷键 Shift + D）" aria-label="切换主题"></button>
        </div>
      </div>

      <!-- ② 圆形头像 + 姓名 -->
      <div class="profile">
        <div class="avatar">
          <img id="avatarImg" alt="个人头像" hidden>
          <span class="avatar__fallback" id="avatarFallback">A</span>
          <span class="avatar__ring" aria-hidden="true"></span>
        </div>
        <h1 class="profile__name" id="profileName">你的名字</h1>
        <p class="profile__title" id="profileTitle"></p>
        <p class="profile__motto" id="profileMotto"></p>
      </div>

      <!-- ③ 音乐播放器 -->
      <section class="player" id="player" aria-label="音乐播放器">
        <div class="player__head">
          <!-- 唱片：不是头像照片，而是一张「彩色胶皮唱片」——
               底色取自强调色，带音槽纹路与中心圆标，播放时整体旋转 -->
          <div class="disc" id="disc">
            <span class="disc__grooves" aria-hidden="true"></span>
            <span class="disc__label" aria-hidden="true"></span>
            <span class="disc__hole" aria-hidden="true"></span>
          </div>
          <div class="player__meta">
            <div class="player__song" id="songTitle">未加载音乐</div>
            <div class="player__artist" id="songArtist">还没有音乐 · 去设置里导入</div>
          </div>
          <button class="icon-btn icon-btn--sm" id="loopBtn" type="button" title="循环模式" aria-label="循环模式"></button>
          <button class="icon-btn icon-btn--sm" id="listBtn" type="button" title="播放列表" aria-label="播放列表"></button>
        </div>

        <div class="player__progress">
          <input class="range" type="range" id="seek" min="0" max="1000" value="0" aria-label="播放进度">
          <div class="player__time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
        </div>

        <div class="player__controls">
          <button class="ctrl" id="prevBtn" type="button" title="上一首" aria-label="上一首"></button>
          <button class="ctrl ctrl--main" id="playBtn" type="button" title="播放 / 暂停（空格）" aria-label="播放"></button>
          <button class="ctrl" id="nextBtn" type="button" title="下一首" aria-label="下一首"></button>
          <div class="player__volume">
            <span id="volumeIco" aria-hidden="true"></span>
            <input class="range" type="range" id="volume" min="0" max="100" value="80" aria-label="音量">
          </div>
        </div>

        <div class="playlist" id="playlist" hidden></div>
      </section>

      <!-- ④ 歌词浮层：随播放进度逐行浮现 -->
      <section class="lyrics" id="lyricsPanel" aria-label="歌词">
        <div class="lyrics__head"><span>歌词 Lyrics</span><span id="lyricHint">—</span></div>
        <div class="lyrics__viewport" id="lyricViewport">
          <div class="lyric-empty">播放音乐后，歌词会在这里浮现</div>
        </div>
      </section>

    </div>
  </aside>

  <!-- =======================================================================
       右侧内容区（grid-area: content）
         板块自上而下固定顺序：个人简介 → 自身技能 → 个人项目 → 联系方式
       ==================================================================== -->
  <main class="content">

    <!-- 板块一：个人简介（普通文本排版） -->
    <section class="section glass reveal" id="sec-bio" style="--i:0">
      <header class="section__head">
        <h2 class="section__title"><span class="dot"></span>个人简介</h2>
        <span class="section__en">About Me</span>
      </header>
      <div class="bio" id="bioText"></div>
      <div class="bio__meta" id="bioMeta" hidden></div>
    </section>

    <!-- 板块二：自身技能（毛玻璃卡片网格，设置里可用「+」无限新增） -->
    <section class="section glass reveal" id="sec-skills" style="--i:1">
      <header class="section__head">
        <h2 class="section__title"><span class="dot"></span>自身技能</h2>
        <span class="section__en">Skills <em id="skillCount"></em></span>
      </header>

      <!-- ★ 网格合并示例：
             grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
             grid-auto-rows: 104px;          统一行高，方便跨行合并
             grid-auto-flow: dense;          合并留下的空洞由后续卡片回填
             卡片尺寸由设置里的「卡片尺寸」决定：
               wide → grid-column: span 2        横向合并 2 列
               tall → grid-row: span 2           纵向合并 2 行
               big  → span 2 / span 2            2×2 合并 4 格                    -->
      <div class="skills-grid" id="skillsGrid"></div>
    </section>

    <!-- 板块三：个人项目（点击任意毛玻璃卡片 = 跳转 GitHub 主页） -->
    <section class="section glass reveal" id="sec-projects" style="--i:2">
      <header class="section__head">
        <h2 class="section__title"><span class="dot"></span>个人项目</h2>
        <div class="section__actions">
          <a class="chip" id="githubHome" href="#" target="_blank" rel="noopener" hidden></a>
          <span class="section__en">Projects</span>
        </div>
      </header>
      <div class="projects-grid" id="projectsGrid"></div>
    </section>

    <!-- 板块四：联系方式（微信 / QQ / 邮箱 / 电话，点击卡片复制） -->
    <section class="section glass reveal" id="sec-contact" style="--i:3">
      <header class="section__head">
        <h2 class="section__title"><span class="dot"></span>联系方式</h2>
        <span class="section__en">Contact</span>
      </header>
      <div class="contact-grid" id="contactGrid"></div>
    </section>

    <p class="foot">
      空格键播放 / 暂停 · <kbd>Shift</kbd> + <kbd>D</kbd> 切换昼夜 ·
      <a href="settings.html">进入设置</a> 编辑全部内容
    </p>
  </main>
</div>

<!-- 音乐播放内核 -->
<audio id="audio" preload="metadata"></audio>

<!-- 轻提示 -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/store.js?v=13"></script>
<script src="js/theme.js?v=13"></script>
<script src="js/main.js?v=13"></script>
</body>
</html>
