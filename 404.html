<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面走丢了 · 404</title>
<!--
  404 页面：GitHub Pages 会用本文件响应所有未知路径。
  注意：此时浏览器地址可能是 /仓库名/任意/深/路径，相对路径的 css/js 会解析错位置，
  所以这里把样式全部内联，并用 JS 向上探测第一个含 index.html 的目录再跳过去 ——
  这样无论部署在 user.github.io/仓库名/ 还是自定义域名根目录都能正确回到主页。

  视觉：沿用站点的「新拟态 × 苹果」语言 —— 表面色 = 背景色，
        立体感完全由一对互补阴影（左上受光 / 右下背光）制造。
-->
<style>
  :root {
    color-scheme: dark;
    --bg: #14161c;
    --text: #f2f4f8;
    --muted: #98a1b2;
    --accent: #0a84ff;
    --sh-light: rgba(255, 255, 255, .055);
    --sh-dark: rgba(0, 0, 0, .62);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    font-family: "SF Pro Text", "SF Pro Display", -apple-system, BlinkMacSystemFont,
                 "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    letter-spacing: -.006em;
    color: var(--text);
    background: var(--bg);
    background-image:
      radial-gradient(60vw 60vw at 10% 0%, rgba(10, 132, 255, .20), transparent 62%),
      radial-gradient(50vw 50vw at 90% 20%, rgba(100, 181, 255, .14), transparent 62%),
      radial-gradient(50vw 50vw at 50% 100%, rgba(140, 120, 255, .12), transparent 62%);
  }
  /* 新拟态面板：表面 = 背景，靠一对阴影「长」出来 */
  .box {
    width: min(520px, calc(100% - 40px));
    padding: 36px 32px;
    text-align: center;
    border-radius: 22px;
    background: var(--bg);
    border: 1px solid rgba(255, 255, 255, .05);
    box-shadow:
      -6px -6px 14px var(--sh-light),
      6px 6px 14px var(--sh-dark),
      inset 0 1px 0 var(--sh-light);
  }
  .code {
    font-size: 64px; font-weight: 800; line-height: 1;
    background: linear-gradient(135deg, #0a84ff, #64b5ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 { margin: 14px 0 8px; font-size: 19px; }
  p { margin: 0 0 22px; font-size: 13.5px; line-height: 1.9; color: var(--muted); }
  a.btn {
    display: inline-block; padding: 11px 24px;
    font-size: 14px; font-weight: 600; color: #fff; text-decoration: none;
    border-radius: 999px;
    background: var(--accent);                     /* 苹果式实心胶囊 */
    box-shadow: 0 6px 16px -6px rgba(10, 132, 255, .6);
  }
  a.btn:active { box-shadow: inset 3px 3px 7px rgba(0,0,0,.45), inset -3px -3px 7px rgba(255,255,255,.06); }
  .path { margin-top: 18px; font-size: 11.5px; color: var(--muted); opacity: .75; word-break: break-all; }
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>这个页面走丢了</h1>
    <p>地址可能写错了，或者文件被移动过。<br>正在尝试带你回到主页…</p>
    <a class="btn" id="homeLink" href="./">返回主页</a>
    <div class="path" id="pathInfo"></div>
  </div>

<script>
  (function () {
    var pathEl = document.getElementById('pathInfo');
    var linkEl = document.getElementById('homeLink');
    if (pathEl) pathEl.textContent = location.pathname;

    // 从当前路径逐级向上探测，找到第一个含 index.html 的目录
    var segs = location.pathname.split('/').filter(Boolean);
    var prefix = location.pathname.replace(/\/[^/]*$/, '/');   // 去掉最后一段（可能是文件名）
    var candidates = [];
    for (var i = segs.length; i >= 0; i--) {
      candidates.push('/' + segs.slice(0, i).join('/') + (i ? '/' : ''));
    }
    if (candidates.indexOf(prefix) < 0) candidates.unshift(prefix);

    (function probe(idx) {
      if (idx >= candidates.length) return;                    // 探测失败就保持 ./ 链接
      var base = candidates[idx];
      fetch(base + 'index.html', { method: 'HEAD' })
        .then(function (res) {
          if (res && res.ok) {
            linkEl.href = base + 'index.html';
            location.replace(base + 'index.html');
          } else {
            probe(idx + 1);
          }
        })
        .catch(function () { probe(idx + 1); });
    })(0);
  })();
</script>
</body>
</html>
